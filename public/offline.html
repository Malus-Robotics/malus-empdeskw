<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Employee Desk</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f5fa;
           font-family: system-ui, sans-serif; color: #1b1b2f; text-align: center; padding: 24px; }
    .card { background: #fff; border-radius: 18px; padding: 32px 28px; max-width: 340px;
            box-shadow: 0 12px 30px rgba(30,30,80,.1); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #6b6f85; font-size: 14px; line-height: 1.5; }
    button { background: #4f46e5; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px;
             font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You&rsquo;re offline</h1>
    <p>Employee Desk needs a connection to load your tasks and leaves. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
